name: site
on:
  pull_request:
    paths: ["docs/**", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "AGENTS.md", "CODE_OF_CONDUCT.md", "VERSION", "tools/site/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # commit and tag counts on the statistics page
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod, check-latest: true }
      - name: Test the generator
        run: cd tools/site && go vet ./... && go test -count=1 ./...
      - name: Build the binary the reference pages are generated from
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/repo-keeper" ./cmd/repo-keeper
      - name: Test coverage for the statistics page
        run: go test -count=1 -coverprofile="$RUNNER_TEMP/coverage.out" ./...
      - name: Published releases (downloads and statistics)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
      - name: Build the site
        run: >
          cd tools/site && go run . -repo ../.. -bin "$RUNNER_TEMP/repo-keeper" -coverage "$RUNNER_TEMP/coverage.out"
          -releases "$RUNNER_TEMP/releases.json" -repo-url "https://github.com/$GITHUB_REPOSITORY" -out "$RUNNER_TEMP/_site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: ${{ runner.temp }}/_site }
  deploy:
    # only the default branch, tags and published releases go live; a pull request only proves the site builds
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

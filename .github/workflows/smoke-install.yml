name: smoke-install
# Installs the published release through every channel on a clean machine. Not a required check: it runs after publishing
# (Scoop and install.sh need the public assets) and opens an issue when a channel is broken.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag, e.g. v0.1.0-beta.7"
        required: true
permissions:
  contents: read
concurrency:
  group: smoke-install-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env: { TAG: "${{ github.event.release.tag_name || inputs.tag }}" }
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  install-script:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ needs.prepare.outputs.tag }}" }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: install.sh verifies and installs the release
        env: { VERSION: "${{ needs.prepare.outputs.version }}" }
        run: |
          sh scripts/install.sh --version "$VERSION" --prefix "$RUNNER_TEMP/rk" --no-units
          out=$("$RUNNER_TEMP/rk/bin/repo-keeper" version); echo "$out"
          [[ "$out" == "repo-keeper $VERSION "* ]]

  tarball:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The commands from docs/INSTALL.md verify the tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt -p checksums.txt.sigstore.json -p "repo-keeper_${VERSION}_linux_amd64.tar.gz"
          cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --check --ignore-missing checksums.txt
          gh attestation verify "repo-keeper_${VERSION}_linux_amd64.tar.gz" --repo "$GITHUB_REPOSITORY"
          tar xzf "repo-keeper_${VERSION}_linux_amd64.tar.gz"
          out=$(./repo-keeper version); echo "$out"
          [[ "$out" == "repo-keeper $VERSION "* ]]

  packages:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: deb, image: "debian:stable-slim", ext: deb, install: "apt-get update -qq && apt-get install -y -qq" }
          - { name: rpm, image: "fedora:latest", ext: rpm, install: "dnf install -y -q" }
    runs-on: ubuntu-latest
    steps:
      - name: ${{ matrix.name }} installs in a clean container
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EXT: ${{ matrix.ext }}
          IMAGE: ${{ matrix.image }}
          INSTALL: ${{ matrix.install }}
        run: |
          f="repo-keeper_${VERSION}_linux_amd64.$EXT"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt -p "$f"
          sha256sum --check --ignore-missing checksums.txt
          docker run --rm -v "$PWD:/w" -e F="$f" -e VERSION="$VERSION" "$IMAGE" sh -ec "$INSTALL /w/\$F && out=\$(repo-keeper version) && echo \"\$out\" && case \"\$out\" in \"repo-keeper \$VERSION \"*) ;; *) exit 1 ;; esac"

  scoop:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Scoop installs from the bucket
        shell: pwsh
        env: { VERSION: "${{ needs.prepare.outputs.version }}" }
        run: |
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            Invoke-RestMethod -Uri https://get.scoop.sh -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
            & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin
          }
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add repo-keeper https://github.com/basmulder03/scoop-bucket
          scoop install repo-keeper
          if ($LASTEXITCODE -ne 0) { throw "scoop install failed" }
          $out = (& repo-keeper version) -join "`n"
          $out
          if ($out -notlike "repo-keeper $env:VERSION *") { throw "unexpected version output" }
          if (-not (Get-Command repo-keeper-tray -ErrorAction SilentlyContinue)) { throw "repo-keeper-tray shim missing" }

  nix:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: nix run builds the tagged release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          out=$(nix run "github:$GITHUB_REPOSITORY/$TAG" -- version); echo "$out"
          [[ "$out" == "repo-keeper $VERSION "* ]]

  report:
    needs: [prepare, install-script, tarball, packages, scoop, nix]
    if: failure() && github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "Install smoke test failed for $TAG" \
            --body "A channel failed to install the published release $TAG. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

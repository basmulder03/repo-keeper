name: fuzz
on:
  schedule: [{ cron: "41 3 * * 0" }]   # weekly
  workflow_dispatch:
    inputs:
      fuzztime: { description: "time per target", default: "60s" }
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod, check-latest: true }
      - name: Fuzz every target
        run: FUZZTIME="${{ inputs.fuzztime || '60s' }}" ./scripts/fuzz.sh
      - name: Keep crashers (commit them under testdata/fuzz to make them permanent regression tests)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

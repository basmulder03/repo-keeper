name: fuzz
on:
  schedule: [{ cron: "41 3 * * 0" }]   # weekly
  workflow_dispatch:
    inputs:
      fuzztime: { description: "time per target", default: "60s" }
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, check-latest: true }
      - name: Fuzz every target
        run: FUZZTIME="${{ inputs.fuzztime || '60s' }}" ./scripts/fuzz.sh
      - name: Keep crashers (commit them under testdata/fuzz to make them permanent regression tests)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

name: fuzz
on:
  schedule: [{ cron: "41 3 * * 0" }]   # weekly
  workflow_dispatch:
    inputs:
      fuzztime: { description: "time per target", default: "60s" }
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod, check-latest: true }
      - name: Fuzz every target
        run: FUZZTIME="${{ inputs.fuzztime || '60s' }}" ./scripts/fuzz.sh
      - name: Keep crashers (commit them under testdata/fuzz to make them permanent regression tests)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

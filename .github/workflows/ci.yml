name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod, check-latest: true }
      - run: go test -race -cover -coverprofile=coverage.out ./...
        shell: bash
      - run: go build ./...
      - name: Coverage floors (Linux leg only; Windows/macOS legs run the tests)
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/coverage-gate.sh coverage.out
  lint-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod, check-latest: true }
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: { version: v2.14.0 } # keep in step with the dev shell (nixpkgs)
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0 && govulncheck ./...
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0 && gosec -quiet ./...
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code -- go.mod
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix flake check   # builds the package (with tests) and evaluates the Home Manager and NixOS modules
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod, check-latest: true }
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with: { version: "~> v2", args: check }
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with: { version: "~> v2", install-only: true }
      - name: Release artifacts are reproducible
        run: ./scripts/check-reproducible.sh

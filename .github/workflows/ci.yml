name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows is not a supported platform yet (docs/ROADMAP.md): its tests are informational until the POSIX-centric
    # fixtures are ported, but the leg keeps running so regressions in portable code (like the store) are seen.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, check-latest: true }
      - run: go test -race -cover -coverprofile=coverage.out ./...
      - run: go build ./...
      - name: Coverage floors (Linux leg only; Windows/macOS legs run the tests)
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/coverage-gate.sh coverage.out
  lint-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, check-latest: true }
      - uses: golangci/golangci-lint-action@v8
        with: { version: latest }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest && gosec -quiet ./...
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code -- go.mod
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check   # builds the package (with tests) and evaluates the Home Manager and NixOS modules
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, check-latest: true }
      - uses: goreleaser/goreleaser-action@v6
        with: { version: "~> v2", args: check }
      - uses: goreleaser/goreleaser-action@v6
        with: { version: "~> v2", install-only: true }
      - name: Release artifacts are reproducible
        run: ./scripts/check-reproducible.sh

name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows is not a supported platform yet (docs/ROADMAP.md): its tests are informational until the POSIX-centric
    # fixtures are ported, but the leg keeps running so regressions in portable code (like the store) are seen.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod, check-latest: true }
      - run: go test -race -cover -coverprofile=coverage.out ./...
      - run: go build ./...
      - name: Coverage floors (Linux leg only; Windows/macOS legs run the tests)
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/coverage-gate.sh coverage.out
  lint-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod, check-latest: true }
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: { version: v2.14.0 } # keep in step with the dev shell (nixpkgs)
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0 && govulncheck ./...
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0 && gosec -quiet ./...
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code -- go.mod
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix flake check   # builds the package (with tests) and evaluates the Home Manager and NixOS modules
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go.mod, check-latest: true }
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with: { version: "~> v2", args: check }
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with: { version: "~> v2", install-only: true }
      - name: Release artifacts are reproducible
        run: ./scripts/check-reproducible.sh
